[phases.setup]
nixPkgs = [
    'php82',
    'php82Packages.composer',
    'php82Extensions.pdo',
    'php82Extensions.pdo_mysql',
    'php82Extensions.mysqli',
    'php82Extensions.mbstring',
    'php82Extensions.xml',
    'php82Extensions.curl',
    'php82Extensions.zip',
    'php82Extensions.gd',
    'php82Extensions.intl',
    'php82Extensions.bcmath',
    'php82Extensions.openssl',
    'php82Extensions.tokenizer',
    'php82Extensions.ctype',
    'php82Extensions.fileinfo',
    'nodejs_18'
]

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction'
]

[phases.build]
cmds = [
    'npm ci --production --silent || echo "NPM build skipped"',
    'npm run build --silent || echo "NPM build skipped"',
    'php bin/console mautic:assets:generate --env=prod --no-interaction || echo "Assets generation skipped"'
]

[start]
cmd = 'php -S 0.0.0.0:$PORT -t docroot'
