# OPÇÃO 1: Se existe pasta public/
[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --no-interaction']

[start]
cmd = 'php -S 0.0.0.0:$PORT -t public'

